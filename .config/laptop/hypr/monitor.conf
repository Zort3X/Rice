monitor = , preferred, auto, 1

# This wildcard rule auto-configures whatever panel is present at its
# preferred resolution/refresh rate. To pin it explicitly instead, run
# `hyprctl monitors all` after first login to get the real output name
# (usually eDP-1) and replace the line above, e.g.:
# monitor = eDP-1, 1920x1080@60, 0x0, 1
